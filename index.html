<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Mall</title>
    <link rel="icon" type="image/png" href="https://deci.eyouthbusiness.com/favicon.svg">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .logo-img {
            height: 50px;
            align-self: center;
        }

        .heading {
            color: #1a252f;
            display: inline-block;
            margin-left: 10px;
            font-size: 2rem;
        }

        p {
            color: #666;
            font-style: italic;
            margin-top: 15px;
            margin-bottom: 25px;
        }

        .store-list {
            padding: 0;
            list-style: none;
        }

        .store-list li {
            background-color: #ffffff;
            color: #2c3e50;
            padding: 15px 20px;
            margin: 10px 0;
            border-radius: 8px;
            font-weight: bold;
            border-left: 5px solid #007bff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s, background-color 0.2s;
        }

        .store-list li:hover {
            transform: translateX(5px);
            background-color: #e9ecef;
        }
    </style>
</head>
<body>
    <img src="https://deci.eyouthbusiness.com/favicon.svg" alt="Logo" class="logo-img">
    <h1 class="heading">Future Mall</h1>
    <p>Test for rn cz Im lazy af</p>
    <ul class="store-list">
        <li>Byte & Wear</li>
        <li>Tech Zone</li>
        <li>Pixel Cafe</li>
        <li>Game Vault</li>
        <li>Daily Mart</li>
    </ul>
</body>
</html>
